---
# Multi-host fleet playbook, run from krypton → hardened, docker-ready hosts.
#   cd ansible && ansible-playbook site.yml            # both groups
#   cd ansible && ansible-playbook site.yml --limit radon
#
# One play per inventory group (nas, edge). Idempotent: a clean second run
# reports no changes. Become passwords are the sops-encrypted
# ansible_become_password loaded from each host's host_vars/<host>/secrets.sops.yml
# at run-time; they are never written to the target.
- name: Bring nas hosts to a hardened, docker-ready state
  hosts: nas
  become: true
  roles:
    - role: base
      tags: [base]
    - role: geerlingguy.docker
      tags: [docker]
    - role: storage_hdd
      tags: [storage, storage_hdd]
    - role: storage_ssd
      tags: [storage, storage_ssd]
    - role: sensors
      tags: [sensors, monitoring]
    - role: compose_stack
      tags: [compose, services]
    - role: restic_backup
      tags: [backup, restic]
    # issue 046 — host vitals / capacity / drive temps to MQTT for Home Assistant.
    # After compose_stack on purpose: the container half (docker2mqtt) ships with
    # the stack, and running this last means the host publisher is installed once
    # the broker credentials it shares with the stack are already in place.
    - role: mqtt_metrics
      tags: [mqtt_metrics, monitoring]

# edge — public-facing hosts (radon). base + docker, then the public edge_stack
# role (Traefik serving the Cloudflare Origin cert via the file provider + the
# settleup app). No NetBird mesh, no DOCKER-USER LAN drop, no iptables-persistent
# (it would evict ufw — see issues/028); only Traefik publishes ports.
- name: Bring edge hosts to a hardened, docker-ready state
  hosts: edge
  become: true
  roles:
    - role: base
      tags: [base]
    - role: geerlingguy.docker
      tags: [docker]
    - role: edge_stack
      tags: [edge_stack, services]
