---
# Drop the restic-backup unit + its OnFailure= alert unit + its timer, and
# enable the TIMER (the backup service is oneshot, triggered by its timer, not
# enabled directly). daemon-reload runs via handler after the unit files
# change. Mirrors storage_ssd's btrfs-scrub / storage_hdd's SnapRAID timer
# pattern exactly, including hardcoded paths in the static unit files (they
# must match restic_backup_source / restic_repo_path / restic_password_file
# below — see the comments in the unit files themselves).
- name: Install restic-backup systemd units
  become: true
  ansible.builtin.copy:
    src: "systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - restic-backup.service
    - restic-backup-alert.service
    - restic-backup.timer
  notify: Reload systemd

- name: Reload systemd now (before enabling the timer)
  ansible.builtin.meta: flush_handlers

- name: Enable and start the restic-backup timer
  become: true
  ansible.builtin.systemd_service:
    name: restic-backup.timer
    enabled: true
    state: started
