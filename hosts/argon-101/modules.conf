# Modules to install on 'argon-101' (Debian 13 VM on argon, VMID 101).
# Role: NetBird routing peer — advertises 192.168.1.0/24 to remote mesh peers
# so a single VM is the only entry point for off-LAN homelab access.
#
# Created from the community-scripts/ProxmoxVE debian-13-vm.sh helper, then
# reset via cloud-init to: hostname=argon-101, user=ms (NOPASSWD sudo by
# default), SSH keys = github.com/stromdahl.keys, IPv4 via DHCP.
#
# Run as the `ms` user: `cd ~/.dotfiles && ./install.sh`.

# System base
base
ssh
sshd

# Shell
bash-server
git

# PVE integration (clean shutdown, see guest IP, fsfreeze backups)
qemu-guest-agent

# Admin editing
nvim
fzf

# NetBird routing peer
netbird
netbird-router

# Updates
unattended-upgrades
