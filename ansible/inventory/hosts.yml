---
# Multi-host fleet inventory, pushed from krypton over SSH. Two groups, each with
# its own play in site.yml:
#   nas  — private NAS/services hosts (base + docker + storage + stack + backup).
#   edge — public-facing hosts (base + docker only; the edge stack arrives with
#          radon in issue 024). Empty until radon is provisioned (issue 022).
#
# helium's address assumes a pinned DHCP reservation keyed to its NIC MAC (a
# one-time manual router step the inventory depends on).
all:
  children:
    nas:
      hosts:
        helium:
          ansible_host: 192.168.1.191
          ansible_user: ms
    edge:
      hosts: {}
  vars:
    ansible_python_interpreter: /usr/bin/python3
