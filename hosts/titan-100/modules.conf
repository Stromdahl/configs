# Modules to install on 'titan-100' (Proxmox VM on titan, ex-xenon hardware).
# Gaming-focused HTPC; media-server modules (kodi, jellyfin-media-player, cec, firefox)
# stay commented out until that side gets built out.
#
# VM specifics vs. xenon:
#   - microcode  : host's job, not the guest's.
#   - wol        : Proxmox handles VM start; the wol@.service template is for
#                  physical NICs and just spins on a virtio interface.
#   - nvidia     : assumes the RTX 2060 is PCI-passed-through to this VM.
#   - bluetooth / gamepad : assume USB passthrough of the relevant devices.

# System base
base
apt-sources
locale
ssh
sshd
bash-server
git

# Proxmox VM integration (host can clean-shutdown, see guest IP, fsfreeze backups)
qemu-guest-agent

# 32-bit + GPU stack (apt-sources must run first for non-free)
i386-multiarch
nvidia

# Audio + Plasma (pipewire BEFORE kde, same reason as xenon)
pipewire
kde

# Couch user + autologin + HTPC-specific tweaks
couch-user
sddm-autologin
htpc-tweaks

# Gaming
flatpak
steam
gamepad
bluetooth

# Media side — enable as we build it out
# kodi
# jellyfin-media-player
# firefox
# cec

# Updates (HTPC blacklist layered on top)
unattended-upgrades
unattended-upgrades-htpc

# Existing modules reused
gtk
userdirs
xkb
fzf
nvim
syncthing
