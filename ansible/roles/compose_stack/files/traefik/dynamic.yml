tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256

http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: camera=(), microphone=(), geolocation=()

    # LG WebOS Jellyfin app loads jellyfin-web in a webview the engine treats
    # as a frame, so X-Frame-Options: DENY breaks it.
    jellyfin-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: camera=(), microphone=(), geolocation=()

  # Home Assistant runs off-box (HAOS VM on argon, 192.168.1.99:8123, HTTP only),
  # so it can't use Docker labels — it's wired in here as a file-provider router.
  # HA must trust this proxy: 192.168.1.191/32 is in HA's http.trusted_proxies.
  # Served at the apex home.stromdahl.tech (homepage moved back to homepage.*).
  # Both names are kept, deliberately: the public Cloudflare record is the
  # *wildcard* `*.home.stromdahl.tech`, and a wildcard does not match the zero-label
  # apex — so home.stromdahl.tech resolves only on-LAN via OPNsense split-horizon,
  # while ha.home.stromdahl.tech also resolves while roaming. Drop the ha.* alias
  # only once an apex A record exists at Cloudflare.
  routers:
    homeassistant:
      rule: "Host(`home.stromdahl.tech`) || Host(`ha.home.stromdahl.tech`)"
      entryPoints:
        - websecure
      service: homeassistant
      middlewares:
        - security-headers
      tls:
        certResolver: letsencrypt

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://192.168.1.99:8123"
