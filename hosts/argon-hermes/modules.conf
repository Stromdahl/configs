# Modules to install on 'argon-hermes' (Debian 13 unprivileged LXC on argon,
# VMID 201). Role: always-on Nous Research Hermes agent — Python 3.11 daemon
# that calls external LLM APIs (no model hosted locally).
#
# Container created on argon with `pct create` (see hosts/argon/lxc/README.md).
# Unprivileged, features=nesting=1,keyctl=1, 2 vCPU, 2 GiB RAM, 16 GiB disk,
# vmbr0 DHCP, ms user with NOPASSWD sudo, SSH keys from github.com/stromdahl.keys.
#
# Run as the `ms` user: `cd ~/.dotfiles && ./install.sh`.
#
# CLI-only deployment: no gateway service, no inbound ports beyond SSH.
# First-run setup after `install.sh`:
#   1. cp ~/.hermes/.env.example ~/.hermes/.env
#   2. edit ~/.hermes/.env with one provider's API key
#   3. hermes model    # pick provider/model
#   4. hermes          # start chatting

# System base
base
ssh
sshd

# Shell
bash-server
git

# Admin editing
nvim
fzf

# Hermes agent (Python 3.11 + Node 22 + Playwright Chromium)
hermes

