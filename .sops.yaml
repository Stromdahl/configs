keys:
  # Admin (workstation) keys — anyone who should be able to edit secrets.
  # Add a new line and a new anchor for each new admin; reference them in
  # every creation_rule so all admins can decrypt everything.
  - &admin_ms age1duazmy5j6clvqkmnwtkjfnmk0n5kts0udac2qfeun5z2p6cw74kqa72z8f

creation_rules:
  # Ansible-consumed secrets for the helium pilot (host/group_vars *.sops.yml).
  # Admin key ONLY — helium has no per-host age key, so only the admin can
  # decrypt; values are consumed on krypton at run-time and never land on the box.
  - path_regex: ^ansible/(host_vars|group_vars)/.*\.sops\.ya?ml$
    key_groups:
      - age:
          - *admin_ms

  # Shared (cross-server) secrets, if ever needed. Only admins can decrypt.
  - path_regex: ^shared/secrets(\.[^/]+)?\.env$
    key_groups:
      - age:
          - *admin_ms
