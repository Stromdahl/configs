# Modules to install on 'neon' (Debian docker host, jellyfin.stromdahl.tech).
# Order matters: sops must precede bare-git-repo (so age is on PATH when
# bare-git-repo generates the deploy user's key).
#
# Intentionally skipped (already configured on neon, would conflict):
#   apt-sources : /etc/apt/sources.list already points at debian.lth.se with
#                 the same components; the deb822 file would duplicate it.
#   locale      : neon runs en_GB; this module installs en_DK. Leave alone.
#   docker      : neon runs docker-ce 29.x from docker.com; this module
#                 installs docker.io which would conflict on the docker binary.

# Base system
base
bash
git
network-tools

# SSH + hardening
sshd
ufw
fail2ban
unattended-upgrades

# Homelab deploy pipeline (must come last)
deploy-user
sops
bare-git-repo
