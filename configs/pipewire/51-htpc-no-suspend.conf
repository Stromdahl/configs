## Managed by ~/.dotfiles modules/pipewire.
## Stop PipeWire from suspending HDMI sinks when the TV/AVR powers off — otherwise
## audio binds to a stale node and goes silent until logout.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
