---
# Mirrors modules/fail2ban: enable the sshd jail (5 retries / 600s, 1h ban).
- name: Install fail2ban
  become: true
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Install fail2ban jail.local
  become: true
  ansible.builtin.copy:
    src: fail2ban/jail.local
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  become: true
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
