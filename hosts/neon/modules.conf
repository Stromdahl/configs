# Modules to install on 'jellyfin' (Debian docker host, jellyfin.stromdahl.tech).
# Order matters: docker must precede deploy-user (so docker group exists when
# deploy-user adds itself to it); sops must precede bare-git-repo (so age is
# on PATH when bare-git-repo generates the deploy user's key).

# Base system
base
apt-sources
locale
bash
git

# SSH + hardening
sshd-hardened
ufw
fail2ban
unattended-upgrades

# Container runtime (before deploy-user so docker group exists)
docker

# Homelab deploy pipeline (must come last)
deploy-user
sops
bare-git-repo
