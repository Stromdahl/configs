---
# Plain (non-secret) variables for helium. The become password lives encrypted
# in secrets.sops.yml alongside this file.
#
# Host name/timezone and the shared docker settings now come from the base role
# defaults + group_vars/all.yml (base_hostname={{ inventory_hostname }}=helium,
# base_timezone=Europe/Stockholm, docker_users, compose flags) — same effective
# values, so this file only carries what is genuinely helium-specific.

# Passwordless sudo for the connecting admin user (ms). Opt-in flag consumed by
# base/tasks/sudoers.yml. Enabled here (not fleet-wide) — radon is public-facing
# and keeps password sudo. Apply in isolation with:
#   ansible-playbook site.yml --limit helium --tags sudoers
base_passwordless_sudo: true

# Docker daemon DNS (consumed by the geerlingguy.docker role -> /etc/docker/daemon.json,
# which restarts dockerd on change). REQUIRED on helium: NetBird rewrites the host
# /etc/resolv.conf to point only at its own mesh resolver (100.65.22.72). Docker's
# embedded resolver (127.0.0.11) can't use that as an upstream, so it hands containers
# a resolv.conf marked "NO EXTERNAL NAMESERVERS DEFINED" and EVERY container loses
# external DNS (bazarr can't reach api.opensubtitles.com -> subtitles fail; sonarr/
# radarr/jellyfin lose indexer/metadata lookups too). Pinning explicit upstreams here
# makes container DNS independent of the NetBird-mutated host file. 192.168.1.1 is the
# OPNsense resolver (also preserves *.home.stromdahl.tech split-horizon); 1.1.1.1 is a
# public fallback. Verified: a container on helium_media resolves public names against
# 192.168.1.1. Without this, NetBird re-breaks container DNS on every reboot.
docker_daemon_options:
  dns:
    - "192.168.1.1"
    - "1.1.1.1"

# storage_hdd: the four 12 TB SAS drives behind the LSI 9300-8i HBA. Referenced
# by stable wwn-* by-id symlinks (unique here, unlike the Kingston SSDs). Two
# data drives unioned by mergerfs, two parity drives for SnapRAID dual-fault.
# Role assignment among four identical drives is arbitrary; fixed here.
hdd_data_drives:
  - { id: "wwn-0x5000cca2918cb694", mount: "/mnt/disk1", label: "disk1" }
  - { id: "wwn-0x5000cca294541ed4", mount: "/mnt/disk2", label: "disk2" }
hdd_parity_drives:
  - { id: "wwn-0x5000cca26fc04138", mount: "/mnt/parity1", label: "parity1" }
  - { id: "wwn-0x5000cca2945424c4", mount: "/mnt/parity2", label: "parity2" }
hdd_union_mount: "/srv/media"
# category.create=lfs is load-bearing: fill one data drive before touching the
# other (keeps the second spun down). See roles/storage_hdd/tasks/mergerfs.yml.
hdd_mergerfs_opts: "defaults,allow_other,use_ino,cache.files=partial,dropcacheonclose=true,category.create=lfs,moveonenospc=true,minfreespace=50G,fsname=mergerfs"
# storage_hdd spin-down (issue 004): SAS Power Condition STANDBY_Z timer.
# Units are 100 ms (confirmed on-box via `sdparm --page=po`): 12000 -> 1200 s =
# 20 min idle before the spindle stops. STANDBY_Z is the real spin-down; IDLE_A
# (a shallow ~10 ms-recovery idle) is already firmware-default-enabled at 2 s and
# is left unmanaged. Applied by roles/storage_hdd/tasks/spin_down.yml
# (sdparm --set=STANDBY_Z=1,SZCT=<this> --save) and re-applied every boot by
# hdd-spin-down.service (firmware honoring of --save across a power cycle varies).
hdd_standby_z_timer: 12000

# storage_ssd: the two 480 GB Kingston SUV400 SATA SSDs as a btrfs raid1 mirror —
# the hot/precious data tier (Docker appdata, Immich, Paperless) plus lean scratch
# (downloads, transcode). Addressed by per-serial ata-* by-id symlinks: both SSDs
# share an identical malformed WWN (NAA=0, Kingston UV400 firmware bug), so no
# usable wwn-* link exists. The fstab mount source is the btrfs fs UUID (captured
# after mkfs), not a device path — a multi-device raid1 must mount device-agnostic
# so it still mounts when one member is the dead one.
ssd_pool_mount: /data/ssd
ssd_pool_label: helium-ssd
ssd_devices:
  - /dev/disk/by-id/ata-KINGSTON_SUV400S37480G_50026B767400167E
  - /dev/disk/by-id/ata-KINGSTON_SUV400S37480G_50026B776705BF4D
# Precious subvolumes keep full CoW + checksums; scratch subvolumes are nodatacow
# (mount opt + chattr +C) to avoid CoW fragmentation and pointless checksumming.
ssd_subvolumes_precious: [appdata, immich, paperless]
ssd_subvolumes_scratch: [downloads, transcode]

# compose_stack: Jellyfin + internal-only Traefik, deployed by roles/compose_stack.
# Private-only — reachable over the NetBird mesh at *.{{ compose_domain }}, never the
# public internet or the LAN (DOCKER-USER fix in roles/compose_stack/tasks/firewall.yml).
compose_stack_dir: /opt/helium
compose_domain: home.stromdahl.tech              # -> jellyfin/traefik.home.stromdahl.tech
compose_acme_email: mattias.stromdahl@gmail.com  # LE registration (DNS-01 via Cloudflare)
# Jellyfin uid/gid (mirrors neon's config.env). Must own the SSD appdata + transcode
# dirs and be able to read /srv/media.
jellyfin_puid: 1001
jellyfin_pgid: 1003
# needs-human: render group gid for iGPU/QuickSync. On helium run:
#   getent group render | cut -d: -f3
# then replace the placeholder. The assert in roles/compose_stack fails the deploy
# until this is set, so jellyfin never starts with a wrong/root group.
jellyfin_render_gid: 992   # helium's render group (getent group render), for iGPU/QuickSync
# helium's LAN NIC name (`ip -o link`), for the DOCKER-USER LAN-drop rule.
compose_lan_iface: eno2   # active Intel I210 port = default route (eno1/I219 is down)
# Exposure model (chosen 2026-06-30): LAN + mesh, never public.
#   false (chosen) -> reachable on the home LAN AND over NetBird; the public boundary
#     is OPNsense having no port-forward + helium having no public IP. *.home.stromdahl.tech
#     resolves to helium's LAN IP via an OPNsense Unbound host override. Non-NetBird home
#     clients (TVs/HTPC) can reach Jellyfin. The role REMOVES the DOCKER-USER LAN drop.
#   true -> strict mesh-only: the DOCKER-USER chain drops new LAN conns to published ports,
#     so only NetBird peers (wt0) reach them. Point DNS at the mesh IP if you flip this.
compose_restrict_to_mesh: false

# issue 014 — download automation: gluetun + qBittorrent + *arr + Jellyseerr.
# All behind the existing internal Traefik (subdomain-per-service under
# *.{{ compose_domain }}); reachable LAN+mesh, never public (same boundary as 005).
# gluetun (ProtonVPN/WireGuard) — non-secret config here; WIREGUARD_* (the Proton
# WireGuard PrivateKey + Address from a generated Proton config) are in
# secrets.sops.yml. Server picked by country (Proton uses SERVER_COUNTRIES; the
# WireGuard key is account-wide, not server-locked, so gluetun roams within Sweden).
gluetun_vpn_provider: protonvpn
gluetun_server_countries: Sweden
# Storage placement (issue 014): *arr/qbit config on the SSD *precious* appdata
# subvol; downloads on the SSD *scratch* subvol; media on the HDD union. Downloads
# and media are two filesystems => *arr imports are copy-then-delete (accepted, see
# issue 014 / project_helium_arr_trash). The *arr run as the jellyfin uid/gid so
# they own appdata, downloads, and the migrated media (chowned in issue 008).
arr_appdata_dir: "{{ ssd_pool_mount }}/appdata"       # -> /data/ssd/appdata/<app>
arr_downloads_dir: "{{ ssd_pool_mount }}/downloads"   # -> /data/ssd/downloads (qbit + *arr)
arr_puid: "{{ jellyfin_puid }}"
arr_pgid: "{{ jellyfin_pgid }}"
# Per-app appdata dirs the compose_stack role creates + chowns before first start.
# (gluetun/flaresolverr have no /config volume, so they are not listed.)
# 'cleanuparr' (issue 017) reuses this same loop for its SSD appdata dir.
arr_appdata_apps: [qbittorrent, prowlarr, radarr, sonarr, bazarr, profilarr, jellyseerr, cleanuparr]

# issue 018 — Homepage dashboard (homepage.{{ compose_domain }}). Config on the SSD
# appdata tier; API-fed widgets pull live data over the media bridge. The widget
# secrets live in secrets.sops.yml (radarr_api_key, sonarr_api_key,
# qbittorrent_webui_password). The qBittorrent WebUI username is non-secret:
qbittorrent_webui_username: admin

# issue 006 — Immich (private Google-Photos replacement). CPU-only ML on the i5-9400
# (the RTX 2060 was pulled — no CUDA path). Library AND Postgres both live on the SSD
# *precious* 'immich' subvol (CoW + checksums; small library, so checksums beat
# write-amplification). immich-server runs as ROOT (Immich has no PUID/PGID) and
# writes the library as root; the postgres image self-chowns its data dir on first
# init — so neither bind dir is pre-chowned (left root-owned). Reached at
# immich.{{ compose_domain }} behind the internal Traefik, LAN + mesh, never public.
#
# Pinned to a specific release for reproducibility. NOTE: v3.0.0 is the current stable
# *major* (the task brief predated it and suggested v2.7.5). For a *fresh* install v3's
# breaking changes (REST API; pgvecto.rs -> VectorChord) don't apply. To pin the more
# matured v2.x line instead, set immich_version to a v2.x tag AND swap the postgres /
# valkey image pins in roles/compose_stack/templates/docker-compose.yml.j2 to that
# release's docker-compose.yml (v2.x used a different postgres image).
immich_version: "v3.0.3"
immich_upload_location: "{{ ssd_pool_mount }}/immich/library"   # -> /data/ssd/immich/library
immich_db_location: "{{ ssd_pool_mount }}/immich/postgres"      # -> /data/ssd/immich/postgres
immich_db_username: postgres      # POSTGRES_USER (superuser in the immich postgres image)
immich_db_name: immich            # POSTGRES_DB / DB_DATABASE_NAME
# immich_db_password: lives in secrets.sops.yml (needs-human — mint an [A-Za-z0-9]-only
# value; the deploy fails closed until it exists).

# issue 007 — Paperless-ngx (document ingest / OCR / full-text search). Five services
# (webserver + redis + postgres + gotenberg + tika) mirroring the OFFICIAL paperless-ngx
# postgres-tika compose, adapted to this stack's pattern (namespaced services, dedicated
# internal bridge, no published ports, sops secrets). ALL data — documents/media, the
# consume + export folders, AND the Postgres data dir — lives on the SSD *precious*
# 'paperless' subvol (CoW + checksums; irreplaceable records). Paperless never touches
# /srv/media or the HDD pool. Reached at paperless.{{ compose_domain }} behind the
# internal Traefik, LAN + mesh, never public.
#
# Version: pinned to the latest stable v2 line (v3.0.0 is beta-only as of 2026-07).
# Postgres pinned to 17 with the CLASSIC /var/lib/postgresql/data mount — NOT upstream
# main's pg18 + /var/lib/postgresql, whose version-specific PGDATA path (.../18/docker)
# is a footgun — which keeps issue 006's PGDATA-ownership pattern directly applicable.
paperless_version: "2.20.15"
paperless_data_root: "{{ ssd_pool_mount }}/paperless"   # /data/ssd/paperless/{data,media,consume,export,pgdata}
# OCR (CPU): eng is bundled in the image; swe is installed at container startup via
# PAPERLESS_OCR_LANGUAGES. paperless_ocr_language is the *active* language(s).
paperless_ocr_language: "eng+swe"          # PAPERLESS_OCR_LANGUAGE (active OCR language[s])
paperless_ocr_install_langs: "swe"         # PAPERLESS_OCR_LANGUAGES (extra tesseract pkgs to install)
# Paperless runs as this uid/gid (USERMAP_UID/GID) and chowns its data dirs to it.
# Reuse the stack's jellyfin uid/gid (neon precedent 1001:1003) so it owns the SSD dirs.
paperless_usermap_uid: "{{ jellyfin_puid }}"   # 1001
paperless_usermap_gid: "{{ jellyfin_pgid }}"   # 1003
paperless_db_username: paperless           # PAPERLESS_DBUSER / POSTGRES_USER
paperless_db_name: paperless               # PAPERLESS_DBNAME / POSTGRES_DB
# Secrets in secrets.sops.yml: paperless_secret_key + paperless_db_password (machine-minted;
# the deploy fails closed until they exist). Admin superuser is created at deploy time —
# either by populating the OPTIONAL paperless_admin_user + paperless_admin_password in sops
# (auto-create on first boot) or interactively on the box:
#   docker exec -it paperless document_create_superuser

# issue 029 — Proton Mail Bridge (feeds Paperless mail-ingest with an IMAP mailbox;
# Proton has no native IMAP). Session + gpg/pass keyring persist here under /root in the
# container. On the SSD 'appdata' precious subvol, so restic (issue 016) covers it — though
# it is re-creatable by re-running the interactive `init` login. No secret needed: the
# shenxn `deb` image generates a passphraseless keyring (gpgparams %no-protection).
protonmail_bridge_data: "{{ ssd_pool_mount }}/appdata/protonmail-bridge"

# issue 044 — paperless-gpt: local-LLM title/tag/correspondent suggestions for Paperless,
# via an on-box Ollama (CPU-only, no cloud — documents never leave helium). paperless-gpt
# reads a doc's OCR text over the Paperless REST API, asks Ollama for a title/tags/
# correspondent, and writes it back. It REUSES the existing paperless_api_key (issue 018,
# the homepage widget token) as its API token — that token must belong to a Paperless user
# with WRITE access (the admin) so suggestions can be applied; if the homepage token is
# read-only, mint a dedicated one into sops. OCR stays on Tesseract (LLM-vision OCR is
# impractical on this CPU); paperless-gpt is title/tags/correspondent only and the LLM-OCR
# path is left unconfigured (it is opt-in per-doc, so unconfigured = inert). Reached at
# paperless-gpt.{{ compose_domain }} behind the internal Traefik; Ollama is internal-only
# (no published ports, no Traefik).
#
# RAM GATE (needs-human): check `free -h` on helium before enabling auto-processing or
# bumping the model past qwen2.5:3b (~2.5 GB resident) — it shares the box with CPU-only
# Immich ML and the full stack. Native Paperless AI (PAPERLESS_AI_*) was considered and
# rejected: it only exists in v3.0.0 (beta), and the store is deliberately pinned to stable
# v2 (see paperless_version above). See issues/044.
ollama_version: "0.32.4"                # ollama/ollama image tag (CPU-only)
paperless_gpt_version: "v0.27.0"        # icereed/paperless-gpt image tag
paperless_gpt_llm_model: "qwen2.5:3b"   # pulled into Ollama post-deploy; small + multilingual (eng+swe)

# issue 016 — restic backup of the SSD 'appdata' precious subvolume to the HDD
# pool. Deliberately scoped to the 'appdata' subvol only — *arr databases,
# quality profiles/custom formats, Bazarr's language profile, Jellyseerr
# request history, Jellyfin watch state. NOT the SnapRAID-protected media
# library (explicitly excluded) and NOT the Immich/Paperless precious subvols
# (separate mounts under /data/ssd; deferred to a later issue). Local repo
# only for now — an offsite copy is deferred.
restic_backup_source: "{{ ssd_pool_mount }}/appdata"   # -> /data/ssd/appdata
# Direct path on one HDD pool member's raw ext4 mount (not addressed through
# the mergerfs /srv/media union), so it lands on a deterministic, pinned disk
# and is never subject to mergerfs's create/least-free-space or
# moveonenospc policies (those only govern writes made *through* the union).
# It still sits on a SnapRAID data disk, so it inherits SnapRAID's parity
# protection as a side benefit.
restic_repo_path: "{{ hdd_data_drives[0].mount }}/backups/restic-appdata"  # -> /mnt/disk1/backups/restic-appdata
restic_password_file: /etc/restic/appdata.pass
# restic_repository_password: lives in secrets.sops.yml (machine-minted;
# the repo-init task fails closed until it exists). Retention policy
# (--keep-daily/weekly/monthly) is hardcoded directly in the systemd unit,
# matching the SnapRAID/btrfs-scrub units' static-file convention.

# issue 017 — Cleanuparr (download hygiene: stalled/failed-download cleanup for
# the issue-014 stack). Config on the SSD appdata tier (arr_appdata_apps above);
# no container env vars needed for its business config — download-client +
# arr-app connections and the queue-cleaner schedule/rules are set once, post-
# deploy, via Cleanuparr's own REST API (its sqlite db under /config is the
# source of truth thereafter). It reuses the EXISTING qBittorrent WebUI creds
# and Radarr/Sonarr API keys from issue 014 (read on-box; never re-keyed).
# Cleanuparr's own admin login is a NEW identity (like the Immich/Paperless
# admin) minted into secrets.sops.yml as cleanuparr_admin_password — used only
# for the one-time /api/auth/setup/account call, not templated into stack.env.
cleanuparr_admin_username: admin
