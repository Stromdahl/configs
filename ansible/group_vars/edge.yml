---
# edge group — public-facing hosts (radon). Edge-scoped vars live here.

# Cloudflare's published edge IP ranges. Traefik's websecure entrypoint trusts
# these (forwardedHeaders.trustedIPs in roles/edge_stack) so the client IP it
# uses for the rate-limit key and records in the access log is the real visitor
# (from X-Forwarded-For / CF-Connecting-IP), not the Cloudflare edge that
# terminated the TLS connection. Every edge app on radon sits behind Cloudflare,
# so this is group-wide.
#
# Fetched 2026-07-03 from https://www.cloudflare.com/ips-v4 + /ips-v6
# (cross-checked against https://api.cloudflare.com/client/v4/ips: 15 v4 + 7 v6).
# Refresh if Cloudflare publishes new ranges.
edge_cloudflare_trusted_ips:
  # IPv4
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
  # IPv6
  - 2400:cb00::/32
