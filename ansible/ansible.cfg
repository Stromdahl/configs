# Ansible control config for the fleet control layer. Run from krypton:
#   cd ansible && ansible-playbook site.yml
#
# Two groups (nas, edge); the rest of the fleet stays on the custom dotfiles
# modules. Secrets are sops + age, decrypted on krypton at run-time by the
# community.sops vars plugin — no managed box ever holds an age key.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles:galaxy/roles
collections_path = galaxy/collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml

# host_group_vars loads plain host_vars/group_vars; community.sops.sops loads
# the *.sops.yml siblings (e.g. the become password) and decrypts them with the
# admin age key at ~/.config/sops/age/keys.txt — never copied to the target.
vars_plugins_enabled = host_group_vars, community.sops.sops

[ssh_connection]
pipelining = True
