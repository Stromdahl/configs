---
# Mirrors modules/sshd: a drop-in enforcing key-only auth and no root login.
- name: Install openssh-server
  become: true
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Install sshd hardening drop-in
  become: true
  ansible.builtin.copy:
    src: sshd/10-dotfiles.conf
    dest: /etc/ssh/sshd_config.d/10-dotfiles.conf
    owner: root
    group: root
    mode: "0644"
    # Validate before it lands so a malformed config can't lock us out on reload.
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

- name: Enable and start ssh
  become: true
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started
