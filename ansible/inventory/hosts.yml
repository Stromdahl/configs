---
# helium — the Ansible pilot. Single managed host; pushed from krypton over SSH
# as the `ms` admin user. The address assumes a pinned DHCP reservation keyed to
# helium's NIC MAC (a one-time manual router step the inventory depends on).
all:
  children:
    nas:
      hosts:
        helium:
          ansible_host: 192.168.1.191
          ansible_user: ms
  vars:
    ansible_python_interpreter: /usr/bin/python3
