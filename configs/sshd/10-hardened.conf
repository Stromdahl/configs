# Server SSH profile — stricter than the workstation drop-in.
# Mutually exclusive with 10-dotfiles.conf: install at most one of these
# per host (workstation gets 10-dotfiles.conf via modules/sshd; servers
# get 10-hardened.conf via modules/sshd-hardened).
Port 22
AddressFamily any
ListenAddress 0.0.0.0
ListenAddress ::

PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
ChallengeResponseAuthentication no
UsePAM yes

X11Forwarding no
PrintMotd no
AcceptEnv LANG LC_*

Subsystem sftp /usr/lib/openssh/sftp-server
