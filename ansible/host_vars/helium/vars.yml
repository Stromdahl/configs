---
# Plain (non-secret) variables for helium. The become password lives encrypted
# in secrets.sops.yml alongside this file.
helium_hostname: helium
helium_timezone: Europe/Stockholm

# geerlingguy.docker: install docker-ce engine + compose v2 plugin from the
# official repo. The role derives the apt suite from ansible_distribution_release
# (trixie), which Docker publishes.
docker_install_compose_plugin: true
docker_install_compose: false
docker_users:
  - "{{ ansible_user }}"

# storage_hdd: the four 12 TB SAS drives behind the LSI 9300-8i HBA. Referenced
# by stable wwn-* by-id symlinks (unique here, unlike the Kingston SSDs). Two
# data drives unioned by mergerfs, two parity drives for SnapRAID dual-fault.
# Role assignment among four identical drives is arbitrary; fixed here.
hdd_data_drives:
  - { id: "wwn-0x5000cca2918cb694", mount: "/mnt/disk1", label: "disk1" }
  - { id: "wwn-0x5000cca294541ed4", mount: "/mnt/disk2", label: "disk2" }
hdd_parity_drives:
  - { id: "wwn-0x5000cca26fc04138", mount: "/mnt/parity1", label: "parity1" }
  - { id: "wwn-0x5000cca2945424c4", mount: "/mnt/parity2", label: "parity2" }
hdd_union_mount: "/srv/media"
# category.create=lfs is load-bearing: fill one data drive before touching the
# other (keeps the second spun down). See roles/storage_hdd/tasks/mergerfs.yml.
hdd_mergerfs_opts: "defaults,allow_other,use_ino,cache.files=partial,dropcacheonclose=true,category.create=lfs,moveonenospc=true,minfreespace=50G,fsname=mergerfs"

# storage_ssd: the two 480 GB Kingston SUV400 SATA SSDs as a btrfs raid1 mirror —
# the hot/precious data tier (Docker appdata, Immich, Paperless) plus lean scratch
# (downloads, transcode). Addressed by per-serial ata-* by-id symlinks: both SSDs
# share an identical malformed WWN (NAA=0, Kingston UV400 firmware bug), so no
# usable wwn-* link exists. The fstab mount source is the btrfs fs UUID (captured
# after mkfs), not a device path — a multi-device raid1 must mount device-agnostic
# so it still mounts when one member is the dead one.
ssd_pool_mount: /data/ssd
ssd_pool_label: helium-ssd
ssd_devices:
  - /dev/disk/by-id/ata-KINGSTON_SUV400S37480G_50026B767400167E
  - /dev/disk/by-id/ata-KINGSTON_SUV400S37480G_50026B776705BF4D
# Precious subvolumes keep full CoW + checksums; scratch subvolumes are nodatacow
# (mount opt + chattr +C) to avoid CoW fragmentation and pointless checksumming.
ssd_subvolumes_precious: [appdata, immich, paperless]
ssd_subvolumes_scratch: [downloads, transcode]

# compose_stack: Jellyfin + internal-only Traefik, deployed by roles/compose_stack.
# Private-only — reachable over the NetBird mesh at *.{{ compose_domain }}, never the
# public internet or the LAN (DOCKER-USER fix in roles/compose_stack/tasks/firewall.yml).
compose_stack_dir: /opt/helium
compose_domain: home.stromdahl.tech              # -> jellyfin/traefik.home.stromdahl.tech
compose_acme_email: mattias.stromdahl@gmail.com  # LE registration (DNS-01 via Cloudflare)
# Jellyfin uid/gid (mirrors neon's config.env). Must own the SSD appdata + transcode
# dirs and be able to read /srv/media.
jellyfin_puid: 1001
jellyfin_pgid: 1003
# needs-human: render group gid for iGPU/QuickSync. On helium run:
#   getent group render | cut -d: -f3
# then replace the placeholder. The assert in roles/compose_stack fails the deploy
# until this is set, so jellyfin never starts with a wrong/root group.
jellyfin_render_gid: 99999   # PLACEHOLDER — set to helium's real render gid before deploy
# needs-human: helium's LAN NIC name (`ip -o link`), for the DOCKER-USER LAN-drop rule.
compose_lan_iface: PLACEHOLDER   # e.g. enp1s0 — set before deploy (see firewall.yml)
