[BitTorrent]
Session\DefaultSavePath=/downloads
Session\TempPath=/downloads/incomplete

[Preferences]
# Reverse-proxied behind Traefik on a different host than the WebUI binds to,
# so accept the proxied Host header (otherwise qBittorrent 5.x rejects the
# request and the WebUI is unreachable via qbittorrent.<domain> on first boot).
WebUI\Address=*
WebUI\HostHeaderValidation=false
