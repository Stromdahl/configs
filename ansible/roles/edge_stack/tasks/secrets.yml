---
# Render the Cloudflare Origin certificate + private key to disk for Traefik's
# file provider to serve. Mirrors roles/restic_backup/tasks/secrets.yml: the
# values are sops-sourced (host_vars/radon/secrets.sops.yml, admin-key-only,
# decrypted on krypton at run-time) and never land in git. The key is radon's
# ONLY at-rest secret.
#
# The dir is 0700 and the key 0600, both root-owned; Traefik runs as root
# (uid 0, binds 80/443) inside the container, so the read-only bind mount at
# /etc/traefik/certs lets it read the key. no_log keeps the PEM material out of
# the Ansible output.

- name: Create the Traefik certs directory
  become: true
  ansible.builtin.file:
    path: "{{ edge_stack_dir }}/config/traefik/certs"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the Cloudflare Origin certificate
  become: true
  ansible.builtin.copy:
    content: "{{ cloudflare_origin_cert }}"
    dest: "{{ edge_stack_dir }}/config/traefik/certs/origin.crt"
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Write the Cloudflare Origin private key
  become: true
  ansible.builtin.copy:
    content: "{{ cloudflare_origin_cert_key }}"
    dest: "{{ edge_stack_dir }}/config/traefik/certs/origin.key"
    owner: root
    group: root
    mode: "0600"
  no_log: true
