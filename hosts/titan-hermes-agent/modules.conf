# Modules to install on 'titan-hermes-agent' (Debian 13 VM on titan, VMID 101).
# Cloned from deb13-tmpl (VMID 9000); see hosts/titan/qemu-server/101.conf for
# the live qm config. Role: long-running agent VM — minimal server baseline
# plus syncthing for file exchange. Hermes-agent itself will be layered on
# top later.
#
# Run as the `ms` user: `cd ~/.dotfiles && ./install.sh`.

# System base
base
ssh
sshd

# Shell
bash-server
git

# PVE integration (clean shutdown, see guest IP, fsfreeze backups)
qemu-guest-agent

# Admin editing
nvim
fzf

# File sync
syncthing

# Updates
unattended-upgrades
