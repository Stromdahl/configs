# Managed by ~/.dotfiles modules/zram — compressed in-RAM swap.
# Read by systemd-zram-generator at boot; creates /dev/zram0 as swap.
#
# Sizing: min(half RAM, 8 GiB). On neon's 16 GB that is 8 GiB of zram —
# a spike cushion so a game + browser + shader compile pages into
# compressed RAM instead of triggering an OOM kill. zstd keeps the real
# RAM cost well under the nominal size. No disk swap, no NVMe wear.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
