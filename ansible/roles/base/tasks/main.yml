---
# Base hardening role for helium. Reproduces what the dotfiles hardening modules
# (sshd, ufw, fail2ban, unattended-upgrades) produce, so helium's posture stays
# consistent with the rest of the fleet, plus hostname/timezone.
- name: Set hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ helium_hostname }}"

- name: Set timezone
  become: true
  community.general.timezone:
    name: "{{ helium_timezone }}"

- name: Harden SSH (key-only, no root)
  ansible.builtin.import_tasks: sshd.yml

- name: Firewall (ufw default-deny + ssh/http/https)
  ansible.builtin.import_tasks: ufw.yml

- name: fail2ban sshd jail
  ansible.builtin.import_tasks: fail2ban.yml

- name: Unattended security upgrades
  ansible.builtin.import_tasks: unattended-upgrades.yml
