# Recorder scope — repo source for /config/recorder.yaml, included from
# configuration.yaml as `recorder: !include recorder.yaml`. Issue 046.
#
# Why this file exists at all: docker2mqtt publishes the discovery registrations
# for ten stats sensors per container UNCONDITIONALLY, without guarding them
# behind its own stats flag (upstream 2.6.1). So leaving stats off does not avoid
# those 280 entities on this stack's 28 containers — it only leaves them stuck at
# `unknown` forever. Stats are therefore enabled, and the churn is dealt with
# here instead, where it belongs.
#
# Excluded: the per-container byte counters and their derived rates — eight of the
# ten stats sensors per container, with nothing consuming them.
#
# Honest sizing, since it is easy to assume otherwise: this is belt-and-braces, not
# a rescue. Measured over the same ~2 h window, one container's CPU sensor logged 51
# state changes while its block-input counter logged 3 and network-input 4 — because
# the recorder only stores *changes*, and those cumulative counters are among the
# slowest-moving sensors in the set. The CPU and memory sensors are the real churn,
# and they are deliberately KEPT: their trend is the part worth having.
#
# Also still recorded: every container liveness binary_sensor, and all host metrics
# from the mqtt_metrics role — drive temperatures especially, since their history is
# the early warning for a failing drive.
#
# NOTE: recorder options are not reloadable; changing this file needs an HA
# restart, not a YAML reload.
exclude:
  entity_globs:
    - sensor.helium_containers_*_block_*
    - sensor.helium_containers_*_network_*
