# Modules to install on 'titan-hermes-agent' (Debian 13 VM on titan, VMID 101).
# Cloned from deb13-tmpl (VMID 9000); see hosts/titan/qemu-server/101.conf for
# the live qm config. Role: long-running agent VM running NousResearch's
# Hermes Agent. Layout follows u/Jonathan_Rivera's three-tier memory pattern
# (r/hermesagent post 1stz6gd): hot memory in ~/.hermes/memories/, warm vault
# in ~/hermes-vault/ (Syncthing-shared to krypton), daily notes in Daily/.
#
# Run as the `ms` user: `cd ~/.dotfiles && ./install.sh`.

# System base
base
ssh
sshd

# Shell
bash-server
git

# PVE integration (clean shutdown, see guest IP, fsfreeze backups)
qemu-guest-agent

# Admin editing
nvim
fzf

# File sync
syncthing

# Container runtime
docker

# The agent itself
# hermes-agent

# Updates
unattended-upgrades
