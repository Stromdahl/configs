# Modules to install on 'xenon' (couch / HTPC). One per line.
# NVIDIA RTX 2060, Intel CPU, two users (couch=autologin no-sudo, ms=admin sudo).
# See modules/<name>/install.sh for what each does.

# System base
base
apt-sources
locale
ssh
sshd
bash
git

# CPU + GPU + 32-bit support (apt-sources must run first so non-free is enabled)
microcode
i386-multiarch
nvidia

# Audio + Plasma (pipewire BEFORE kde to avoid a pulseaudio->pipewire swap mid-run)
pipewire
kde

# Couch user + autologin + HTPC-specific tweaks
couch-user
sddm-autologin
htpc-tweaks

# HTPC + gaming apps
flatpak
steam
kodi
jellyfin-media-player
firefox
cec
bluetooth
gamepad
wol

# Updates last (with HTPC-specific blacklist layered on top)
unattended-upgrades
unattended-upgrades-htpc

# Existing modules reused
gtk
userdirs
xkb
fzf
nvim
syncthing
network-tools
