# ~/.config/tmux/tmux.conf
# ─────────────────────────────────────────────────────────────────────────────
# A best-practice STARTER tmux config, written to learn from. Every setting is
# commented with the *why*, not just the *what*. Edit freely — then reload with
# C-b r (binding defined near the bottom).
#
# THE PREFIX
#   tmux commands are "leader" keys: press the prefix, RELEASE it, then press
#   the command key. We keep tmux's default prefix, Ctrl-b (written "C-b"), so
#   every tutorial and cheat sheet you find online matches verbatim.
#       C-b  c   new window          C-b  d   detach (leaves tmux running)
#       C-b  "   split top/bottom    C-b  %   split left/right
#       C-b  [   copy / scroll mode  C-b  ?   list ALL key bindings
#       C-b  :   command prompt      C-b  z   zoom current pane (toggle)
#
# RECONNECTING
#   tmux survives your terminal closing or an SSH drop. List sessions with
#   `tmux ls`, reattach with `tmux attach` (or `tmux a -t <name>`).
# ─────────────────────────────────────────────────────────────────────────────


# ══ 1. General behaviour ═════════════════════════════════════════════════════

# Advertise a 256-colour, italics-capable terminal to programs inside tmux,
# then enable true-colour (24-bit RGB) passthrough for the real terminal we run
# in. Together these make nvim colourschemes look identical in and out of tmux.
set  -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

# Kill the delay after pressing <Esc>. tmux's 500ms default makes nvim feel
# sluggish; 10ms is imperceptible but still safe for multi-byte escape keys.
set -s escape-time 10

# Much larger scrollback (default 2000). Browse it with C-b [ then j/k or /.
set -g history-limit 50000

# Tell vim/nvim when the terminal gains/loses focus (powers :autoread, etc.).
set -g focus-events on

# Keep status messages (like the reload confirmation) readable for 2s.
set -g display-time 2000

# Refresh the status bar clock every 5s instead of the 15s default.
set -g status-interval 5


# ══ 2. Number windows & panes from 1 ═════════════════════════════════════════
# The keyboard number row starts at 1, so making the first window/pane #1 lets
# "C-b 1" jump to the leftmost window without stretching for 0.
set  -g base-index 1
setw -g pane-base-index 1

# Close a window and the rest renumber to stay gap-free (1,3,4 → 1,2,3).
set -g renumber-windows on


# ══ 3. Mouse ═════════════════════════════════════════════════════════════════
# Click panes/windows to focus, drag borders to resize, scroll to page through
# history. Handy while learning; comment this out later to go keyboard-only.
set -g mouse on


# ══ 4. Changing the prefix (optional) ════════════════════════════════════════
# We keep the default C-b. If it ever feels like an awkward reach, the two
# popular alternatives are below — uncomment ONE block and reload.
#
#   # C-Space: ergonomic and conflicts with nothing in bash
#   set -g prefix C-Space
#   unbind C-b
#   bind C-Space send-prefix
#
#   # C-a: classic GNU screen style (note: shadows the shell's "start of line";
#   # press C-a twice to send a literal Ctrl-a to the program underneath)
#   set -g prefix C-a
#   unbind C-b
#   bind C-a send-prefix


# ══ 5. Friendlier splits (that keep the current directory) ═══════════════════
# The defaults C-b % and C-b " are hard to tell apart. Add visual mnemonics:
#   |  splits side-by-side      -  splits top/bottom
# Both new panes (and new windows) open in the SAME directory as the current
# pane. The original % and " bindings still work too.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"


# ══ 6. Vim-style pane movement & resizing ════════════════════════════════════
# Move between panes with prefix + h/j/k/l, mirroring vim's left/down/up/right.
# (This repurposes C-b l, whose default is "last window" — use C-b n/p or a
# window number to switch windows instead.)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize with prefix + H/J/K/L. "-r" = repeatable: after the prefix you can tap
# H H H within ~0.5s without re-pressing C-b each time.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# ══ 7. Copy mode (vim keys) → system clipboard ══════════════════════════════
# Copy mode (C-b [) lets you scroll, search with /, and select text by keyboard.
# Leave it with q. With vi keys: v starts a selection, y yanks it.
setw -g mode-keys vi

# Relay OSC 52 escape sequences from any pane (including processes inside a
# docker sandbox) up to the outer terminal, so they reach the system clipboard
# without sharing the Wayland socket into the container. Also lets tmux itself
# emit OSC 52 when yanking. (Paste back via OSC 52 is intentionally not
# supported — most terminals refuse the read variant for security.)
set -s set-clipboard on

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle          # block/column select

# Yank to the WAYLAND clipboard — krypton runs sway, so we pipe to wl-copy.
# On X11 replace wl-copy with "xclip -selection clipboard"; on macOS "pbcopy".
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
# Releasing a mouse drag also copies the selection, then exits copy mode.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"


# ══ 8. Quality-of-life ═══════════════════════════════════════════════════════
# Reload this file in place — no need to quit tmux after editing.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Pop this config's cheat sheet up in a floating window. Press q to close it.
# (display-popup needs tmux >= 3.2; we're on 3.5.)
bind C-h display-popup -E -w 80% -h 80% "less ~/.config/tmux/CHEATSHEET.md"


# ══ 9. Status bar ════════════════════════════════════════════════════════════
# A calm, readable status line. Colours use the 0–255 palette (#[...] inline
# styling) so the look survives on any terminal. Each segment is explained.
set -g status-position bottom        # change to "top" to keep it clear of your
                                     # shell prompt
set -g status-justify  left
set -g status-style    "bg=colour236,fg=colour250"

# Left: the session name in a coloured pill. #S = session name.
set -g status-left        "#[bg=colour24,fg=colour255,bold] #S #[default] "
set -g status-left-length 30

# Right: weekday/date dimmed, then the time bold. %H:%M is 24-hour clock.
set -g status-right        "#[fg=colour245]%a %d %b #[fg=colour255,bold]%H:%M "
set -g status-right-length 40

# Windows: #I = index, #W = name. The current window gets the coloured pill.
setw -g window-status-format          " #I:#W "
setw -g window-status-current-format  "#[bg=colour24,fg=colour255,bold] #I:#W #[default]"
setw -g window-status-separator       ""

# Pane borders: dim for inactive, bright blue for the focused pane.
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# Command prompt / message line matches the accent colour.
set -g message-style "bg=colour24,fg=colour255"


# ══ 10. Plugins — session persistence (managed by TPM) ═══════════════════════
# Vanilla tmux already survives a terminal closing or an SSH drop. Plugins add
# the next level: saving your whole layout to disk and RESTORING it after a
# full reboot. That's all we add for now — one focused capability.
#
# TPM = Tmux Plugin Manager (the tmux module git-clones it for you). Keys:
#     C-b I        install the plugins declared below
#     C-b U        update them          C-b alt-u   remove undeclared ones
#
# Plugins install to an XDG data dir, NOT here: ~/.config/tmux is a symlink
# into the dotfiles repo, so TPM's default path would clone plugins into your
# working tree. This env var redirects them out. ($HOME is expanded by tmux;
# a literal ~ would NOT be, and TPM can't expand it — keep the "$HOME" form.)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions on demand
set -g @plugin 'tmux-plugins/tmux-continuum'   # automate that save/restore

# resurrect: also capture each pane's on-screen contents, not just the layout.
# Manual save/restore:  C-b Ctrl-s  /  C-b Ctrl-r
set -g @resurrect-capture-pane-contents 'on'

# continuum: auto-save every 15 minutes. Auto-restore is deliberately OFF, so
# tmux never revives old sessions on its own — use C-b C-r to restore by hand.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# Initialise TPM. KEEP THIS LINE LAST — it sources every plugin above.
run "$HOME/.local/share/tmux/plugins/tpm/tpm"
