---
# The repo passphrase is sops-sourced (host_vars/helium/secrets.sops.yml,
# admin-key-only, decrypted on krypton at run-time) and never lands in git or
# the compose .env. It's written once to a root-only file that both the
# systemd service and any ad-hoc `restic` CLI use read via
# --password-file / RESTIC_PASSWORD_FILE — never passed as a CLI argument
# (which would leak it into `ps`).
- name: Create /etc/restic
  become: true
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the restic repository passphrase
  become: true
  ansible.builtin.copy:
    content: "{{ restic_repository_password }}"
    dest: "{{ restic_password_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
