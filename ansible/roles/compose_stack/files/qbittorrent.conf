[BitTorrent]
Session\DefaultSavePath=/downloads
Session\TempPath=/downloads/incomplete

[Preferences]
# Reverse-proxied behind Traefik on a different host than the WebUI binds to,
# so accept the proxied Host header (otherwise qBittorrent 5.x rejects the
# request and the WebUI is unreachable via qbittorrent.<domain> on first boot).
WebUI\Address=*
WebUI\HostHeaderValidation=false
# Bypass WebUI auth for localhost so gluetun's VPN_PORT_FORWARDING_UP_COMMAND can
# POST the forwarded port into qbit's listen_port unauthenticated (gluetun shares
# this netns -> the call arrives from 127.0.0.1). Traefik reaches qbit over the
# `media` bridge, NOT 127.0.0.1, so external WebUI access still requires auth.
WebUI\LocalHostAuth=false
