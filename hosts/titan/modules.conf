# Modules to install on 'titan' (Proxmox VE 9 hypervisor host).
# Minimal admin-shell profile: just what's needed to SSH in, edit configs,
# and do hypervisor admin. The Proxmox-specific config (repos, firewall,
# hostname, vzdump) is NOT modeled as modules — it lives in a one-shot
# host setup, since PVE's pmxcfs and apt repo layout don't fit the
# idempotent module pattern cleanly.
#
# Run as the `ms` admin user (not root): `cd ~/.dotfiles && ./install.sh`.
# `sshd` requires sudo; ms has NOPASSWD via /etc/sudoers.d/10-ms-nopasswd.

# System base
base
ssh
sshd

# Shell
bash
git

# Admin editing
nvim
fzf
