# Modules to install on 'neon' — desk-based Debian gaming desktop.
# Same physical chassis as the retired docker host (jellyfin.stromdahl.tech);
# that server role moved to helium (issue 009). neon is now a single-user rig
# the user sits at: monitor + keyboard/mouse, boots to a normal KDE desktop,
# Steam launched manually. See hosts/neon/PRD.md for the build map.
#
# This is titan-100's proven gaming stack with three deltas:
#   - bare-metal, not a Proxmox VM : no 'qemu-guest-agent'.
#   - desk rig, not couch          : no 'couch-user', 'sddm-autologin',
#                                    'htpc-tweaks', or 'unattended-upgrades-htpc'
#                                    (no autologin, no Big-Picture autostart, no CEC).
#   - sat-at desktop, not HTPC     : desktop 'bash' (not 'bash-server') — this
#                                    is a rig the user works at, not a headless box.
#
# nvidia: RTX 2060 (Turing) — the exact card the module is proven on (issue 032).

# System base
base
apt-sources
locale
ssh
sshd
bash
git

# 32-bit + GPU stack (apt-sources must run first for non-free)
i386-multiarch
nvidia

# Audio + Plasma (pipewire BEFORE kde)
pipewire
kde

# Gaming
flatpak
steam
gamepad
bluetooth

# Updates
unattended-upgrades

# Swap cushion (compressed in-RAM; no swap partition, no hibernation)
zram

# Existing modules reused
gtk
userdirs
xkb
fzf
nvim
syncthing
