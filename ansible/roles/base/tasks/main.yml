---
# Host-agnostic base hardening role. Reproduces what the dotfiles hardening
# modules (sshd, ufw, fail2ban, unattended-upgrades) produce, so every managed
# host keeps a fleet-consistent posture, plus hostname/timezone. Driven by
# base_hostname / base_timezone (see defaults/main.yml) — no per-host names here.
- name: Set hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"

- name: Set timezone
  become: true
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Harden SSH (key-only, no root)
  ansible.builtin.import_tasks: sshd.yml

- name: Firewall (ufw default-deny + ssh/http/https)
  ansible.builtin.import_tasks: ufw.yml

- name: fail2ban sshd jail
  ansible.builtin.import_tasks: fail2ban.yml

- name: Unattended security upgrades
  ansible.builtin.import_tasks: unattended-upgrades.yml

- name: Passwordless sudo for admin user (opt-in per host)
  ansible.builtin.import_tasks: sudoers.yml
  tags: [sudoers]
  when: base_passwordless_sudo | default(false)
