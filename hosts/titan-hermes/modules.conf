# Modules to install on 'titan-hermes' (Debian 13 unprivileged LXC on titan,
# VMID 101). Role: always-on Nous Research Hermes agent — Python 3.11 daemon
# that calls external LLM APIs (no model hosted locally).
#
# Container created on titan with `pct create` (see hosts/titan/lxc/README.md).
# Unprivileged, features=nesting=1,keyctl=1, 2 vCPU, 4 GiB RAM, 32 GiB disk,
# vmbr0 DHCP, ms user with NOPASSWD sudo, SSH keys from github.com/stromdahl.keys.
#
# Run as the `ms` user: `cd ~/.dotfiles && ./install.sh`.
#
# CLI-only deployment: no gateway service, no inbound ports beyond SSH.
# First-run setup after `install.sh`:
#   1. cp ~/.hermes/.env.example ~/.hermes/.env
#   2. paste your OpenRouter API key into ~/.hermes/.env
#   3. hermes model    # pick a model
#   4. hermes          # start chatting
#
# Cost guard: OpenRouter prepaid credits, auto-recharge OFF.

# System base
base
ssh
sshd

# Shell
bash-server
git

# Admin editing
nvim
fzf

# Hermes agent (Python 3.11 + Node 22 + Playwright Chromium)
hermes

# Updates
unattended-upgrades
