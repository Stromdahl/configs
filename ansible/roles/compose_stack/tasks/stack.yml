---
# Render the .env (secrets + config) and docker-compose.yml from templates,
# copy Traefik's static dynamic.yml, then bring the stack up.
#
# community.docker is NOT in the pinned galaxy collections — docker compose
# is invoked via ansible.builtin.command, mirroring neon's deploy.sh idiom.
#
# On-box verify: docker compose writes Created/Started/Recreated to stderr
# (not stdout). The changed_when below parses stderr. Confirm this is still
# true on helium's docker compose version with:
#   docker compose up -d 2>&1 | head -20
#
# On-box note: bash-exported UID/GID env vars may take precedence over
# --env-file values in some shells. Verify that the rendered UID/GID from
# the .env are actually used by confirming `id` inside the jellyfin container
# post-deploy. If they are shadowed, quote the vars in the .env as UID= with
# no conflict, or unset UID/GID in the ansible environment block here.

- name: Create compose_stack_dir
  become: true
  ansible.builtin.file:
    path: "{{ compose_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create traefik config subdirectory
  become: true
  ansible.builtin.file:
    path: "{{ compose_stack_dir }}/config/traefik"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Jellyfin writes config and transcode data under these dirs. They must be
# owned by jellyfin_puid:jellyfin_pgid before first start, otherwise docker
# creates them root-owned and Jellyfin cannot write to them.
- name: Create Jellyfin config dir under ssd appdata
  become: true
  ansible.builtin.file:
    path: "{{ ssd_pool_mount }}/appdata/jellyfin"
    state: directory
    owner: "{{ jellyfin_puid }}"
    group: "{{ jellyfin_pgid }}"
    mode: "0750"

- name: Create Jellyfin transcode dir under ssd scratch
  become: true
  ansible.builtin.file:
    path: "{{ ssd_pool_mount }}/transcode"
    state: directory
    owner: "{{ jellyfin_puid }}"
    group: "{{ jellyfin_pgid }}"
    mode: "0750"

# --- issue 014: download-automation appdata + downloads dirs -----------------
# The *arr/qbit containers create files under these paths as arr_puid:arr_pgid;
# they must be owned by that uid/gid before first start or docker creates them
# root-owned and the apps cannot write. (Skipped cleanly if arr_appdata_apps is
# undefined, e.g. an 005-only deploy.)
- name: Create per-app appdata dirs (issue 014)
  become: true
  ansible.builtin.file:
    path: "{{ arr_appdata_dir }}/{{ item }}"
    state: directory
    owner: "{{ arr_puid }}"
    group: "{{ arr_pgid }}"
    mode: "0750"
  loop: "{{ arr_appdata_apps | default([]) }}"

- name: Ensure the downloads scratch dir is writable by the *arr/qbit uid (issue 014)
  become: true
  ansible.builtin.file:
    path: "{{ arr_downloads_dir }}"
    state: directory
    owner: "{{ arr_puid }}"
    group: "{{ arr_pgid }}"
    mode: "0775"
  when: arr_downloads_dir is defined

# Seed a minimal qBittorrent.conf so the WebUI is reachable through Traefik on
# first boot (qBittorrent 5.x rejects the proxied Host header by default). force:
# false -> only written if absent, so qBittorrent owns it thereafter and re-runs
# stay changed=0.
- name: Create qBittorrent config subdir (issue 014)
  become: true
  ansible.builtin.file:
    path: "{{ arr_appdata_dir }}/qbittorrent/qBittorrent"
    state: directory
    owner: "{{ arr_puid }}"
    group: "{{ arr_pgid }}"
    mode: "0750"
  when: arr_appdata_apps is defined

- name: Seed qBittorrent.conf for reverse-proxy reachability (issue 014)
  become: true
  ansible.builtin.copy:
    src: qbittorrent.conf
    dest: "{{ arr_appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
    owner: "{{ arr_puid }}"
    group: "{{ arr_pgid }}"
    mode: "0640"
    force: false
  when: arr_appdata_apps is defined

# --- issue 018: Homepage dashboard config -----------------------------------
# Config dir on the SSD appdata tier, owned by the jellyfin uid/gid so Homepage
# (running as PUID/PGID) can read its config and write its logs subdir.
- name: Create Homepage config dir under ssd appdata (issue 018)
  become: true
  ansible.builtin.file:
    path: "{{ ssd_pool_mount }}/appdata/homepage"
    state: directory
    owner: "{{ jellyfin_puid }}"
    group: "{{ jellyfin_pgid }}"
    mode: "0750"

# Copied verbatim (NOT templated): the files carry {{HOMEPAGE_VAR_*}} placeholders
# that Homepage resolves at runtime — Jinja must not touch them. force (default
# true) re-asserts the committed config each run; Homepage's own runtime files
# (logs/) live alongside and are left untouched.
- name: Deploy Homepage config files (issue 018)
  become: true
  ansible.builtin.copy:
    src: "homepage/{{ item }}"
    dest: "{{ ssd_pool_mount }}/appdata/homepage/{{ item }}"
    owner: "{{ jellyfin_puid }}"
    group: "{{ jellyfin_pgid }}"
    mode: "0640"
  loop:
    - settings.yaml
    - services.yaml
    - widgets.yaml
    - docker.yaml
    - bookmarks.yaml

# --- issue 006: Immich library + Postgres dirs on the SSD 'immich' precious subvol -
# Both dirs are created root-owned and empty — NOT pre-chowned to a service uid:
# immich-server runs as root (Immich has no PUID/PGID) and writes the library as root,
# and the postgres image self-chowns its data dir to the postgres user on first init.
# The 'immich' btrfs subvol itself is provisioned by the storage_ssd role.
- name: Create Immich library + Postgres dirs on the ssd immich subvol (issue 006)
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ immich_upload_location }}"
    - "{{ immich_db_location }}"

# .env rendered to 0600 — contains Cloudflare DNS token + Traefik dashboard
# basic-auth hash. no_log keeps secret values out of the Ansible output.
- name: Render .env from template (sops secrets + config vars)
  become: true
  ansible.builtin.template:
    src: stack.env.j2
    dest: "{{ compose_stack_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render docker-compose.yml from template
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ compose_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

# Copy verbatim — traefik middleware definitions and TLS options.
# dynamic.yml has no Jinja markers; using copy (not template) makes the
# intent clear and avoids accidental expansion of any future { in the file.
- name: Copy Traefik dynamic config
  become: true
  ansible.builtin.copy:
    src: traefik/dynamic.yml
    dest: "{{ compose_stack_dir }}/config/traefik/dynamic.yml"
    owner: root
    group: root
    mode: "0644"

- name: Bring up the compose stack
  become: true
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f {{ compose_stack_dir }}/docker-compose.yml
      --env-file {{ compose_stack_dir }}/.env
      up -d --remove-orphans
  register: _compose_up
  # docker compose writes progress to stderr (Created/Started/Recreated).
  # We parse stderr because stdout is typically empty on `up -d`.
  changed_when: >-
    'Started' in _compose_up.stderr or
    'Created' in _compose_up.stderr or
    'Recreated' in _compose_up.stderr
