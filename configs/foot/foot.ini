font=Hack Nerd Font Mono:size=9
term=xterm-256color

include=~/.dotfiles/configs/foot/gruvbox_dark.ini

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}

[key-bindings]
# Enter URL mode: visible links get jump-label letters; type the label to act.
# Ctrl+Shift+O opens the link via the [url] launch command above (foot default,
# made explicit here). Ctrl+Shift+Y copies the link to the clipboard instead.
show-urls-launch=Control+Shift+o
show-urls-copy=Control+Shift+y

