---
- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

# The service is oneshot, so there is no running process to restart — what a
# code or config change needs is simply that the NEXT tick picks it up, which it
# does automatically. Restarting the timer only resets the countdown so a change
# is visible within one interval instead of up to one interval later; it is not
# required for correctness.
- name: Restart mqtt-metrics timer
  become: true
  ansible.builtin.systemd_service:
    name: mqtt-metrics.timer
    state: restarted
