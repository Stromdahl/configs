---
# restic backup of the SSD 'appdata' precious subvolume (issue 016) — the
# *arr/Jellyfin/etc curation state (databases, quality profiles, watch state).
# Deliberately scoped: the media library on the HDD pool is SnapRAID-protected
# and explicitly excluded, and the Immich/Paperless precious subvols are
# separate mount points under /data/ssd — out of scope for this slice (a later
# issue extends the same local repo to them). Local repo only; an offsite copy
# is deferred.
- name: Install restic
  ansible.builtin.import_tasks: packages.yml

- name: Repo passphrase from sops (root-only file, never world-readable)
  ansible.builtin.import_tasks: secrets.yml

- name: Initialise the restic repository on the HDD pool (idempotent, guarded)
  ansible.builtin.import_tasks: repo.yml

- name: Scheduled backup + retention/prune systemd timer
  ansible.builtin.import_tasks: timer.yml

# issue 026 — extend the same repo to the Postgres-backed apps (Immich +
# Paperless): a consistent pg_dump + the photo/document libraries, each under its
# own tag, on staggered per-app timers reusing the OnFailure alert pattern.
- name: Per-app (Immich + Paperless) DB dump + library backups (issue 026)
  ansible.builtin.import_tasks: app_backups.yml
