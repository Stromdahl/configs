---
# Render the .env (secrets + config) and docker-compose.yml from templates,
# copy Traefik's static dynamic.yml, then bring the stack up.
#
# community.docker is NOT in the pinned galaxy collections — docker compose
# is invoked via ansible.builtin.command, mirroring neon's deploy.sh idiom.
#
# On-box verify: docker compose writes Created/Started/Recreated to stderr
# (not stdout). The changed_when below parses stderr. Confirm this is still
# true on helium's docker compose version with:
#   docker compose up -d 2>&1 | head -20
#
# On-box note: bash-exported UID/GID env vars may take precedence over
# --env-file values in some shells. Verify that the rendered UID/GID from
# the .env are actually used by confirming `id` inside the jellyfin container
# post-deploy. If they are shadowed, quote the vars in the .env as UID= with
# no conflict, or unset UID/GID in the ansible environment block here.

- name: Create compose_stack_dir
  become: true
  ansible.builtin.file:
    path: "{{ compose_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create traefik config subdirectory
  become: true
  ansible.builtin.file:
    path: "{{ compose_stack_dir }}/config/traefik"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Jellyfin writes config and transcode data under these dirs. They must be
# owned by jellyfin_puid:jellyfin_pgid before first start, otherwise docker
# creates them root-owned and Jellyfin cannot write to them.
- name: Create Jellyfin config dir under ssd appdata
  become: true
  ansible.builtin.file:
    path: "{{ ssd_pool_mount }}/appdata/jellyfin"
    state: directory
    owner: "{{ jellyfin_puid }}"
    group: "{{ jellyfin_pgid }}"
    mode: "0750"

- name: Create Jellyfin transcode dir under ssd scratch
  become: true
  ansible.builtin.file:
    path: "{{ ssd_pool_mount }}/transcode"
    state: directory
    owner: "{{ jellyfin_puid }}"
    group: "{{ jellyfin_pgid }}"
    mode: "0750"

# --- issue 014: download-automation appdata + downloads dirs -----------------
# The *arr/qbit containers create files under these paths as arr_puid:arr_pgid;
# they must be owned by that uid/gid before first start or docker creates them
# root-owned and the apps cannot write. (Skipped cleanly if arr_appdata_apps is
# undefined, e.g. an 005-only deploy.)
- name: Create per-app appdata dirs (issue 014)
  become: true
  ansible.builtin.file:
    path: "{{ arr_appdata_dir }}/{{ item }}"
    state: directory
    owner: "{{ arr_puid }}"
    group: "{{ arr_pgid }}"
    mode: "0750"
  loop: "{{ arr_appdata_apps | default([]) }}"

- name: Ensure the downloads scratch dir is writable by the *arr/qbit uid (issue 014)
  become: true
  ansible.builtin.file:
    path: "{{ arr_downloads_dir }}"
    state: directory
    owner: "{{ arr_puid }}"
    group: "{{ arr_pgid }}"
    mode: "0775"
  when: arr_downloads_dir is defined

# Seed a minimal qBittorrent.conf so the WebUI is reachable through Traefik on
# first boot (qBittorrent 5.x rejects the proxied Host header by default). force:
# false -> only written if absent, so qBittorrent owns it thereafter and re-runs
# stay changed=0.
- name: Create qBittorrent config subdir (issue 014)
  become: true
  ansible.builtin.file:
    path: "{{ arr_appdata_dir }}/qbittorrent/qBittorrent"
    state: directory
    owner: "{{ arr_puid }}"
    group: "{{ arr_pgid }}"
    mode: "0750"
  when: arr_appdata_apps is defined

- name: Seed qBittorrent.conf for reverse-proxy reachability (issue 014)
  become: true
  ansible.builtin.copy:
    src: qbittorrent.conf
    dest: "{{ arr_appdata_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
    owner: "{{ arr_puid }}"
    group: "{{ arr_pgid }}"
    mode: "0640"
    force: false
  when: arr_appdata_apps is defined

# --- issue 018: Homepage dashboard config -----------------------------------
# Config dir on the SSD appdata tier, owned by the jellyfin uid/gid so Homepage
# (running as PUID/PGID) can read its config and write its logs subdir.
- name: Create Homepage config dir under ssd appdata (issue 018)
  become: true
  ansible.builtin.file:
    path: "{{ ssd_pool_mount }}/appdata/homepage"
    state: directory
    owner: "{{ jellyfin_puid }}"
    group: "{{ jellyfin_pgid }}"
    mode: "0750"

# Copied verbatim (NOT templated): the files carry {{HOMEPAGE_VAR_*}} placeholders
# that Homepage resolves at runtime — Jinja must not touch them. force (default
# true) re-asserts the committed config each run; Homepage's own runtime files
# (logs/) live alongside and are left untouched.
- name: Deploy Homepage config files (issue 018)
  become: true
  ansible.builtin.copy:
    src: "homepage/{{ item }}"
    dest: "{{ ssd_pool_mount }}/appdata/homepage/{{ item }}"
    owner: "{{ jellyfin_puid }}"
    group: "{{ jellyfin_pgid }}"
    mode: "0640"
  loop:
    - settings.yaml
    - services.yaml
    - widgets.yaml
    - docker.yaml
    - bookmarks.yaml

# --- issue 006: Immich library + Postgres dirs on the SSD 'immich' precious subvol -
# The 'immich' btrfs subvol itself is provisioned by the storage_ssd role.
# immich-server runs as root (Immich has no PUID/PGID) and writes the library as root,
# so the library dir is root-owned.
- name: Create Immich library dir on the ssd immich subvol (issue 006)
  become: true
  ansible.builtin.file:
    path: "{{ immich_upload_location }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The postgres image chowns PGDATA to the postgres user (uid 999, mode 0700) on first
# init. Ansible must NOT enforce owner/group/mode here — doing so resets the dir to
# root:root 0755 every run, which breaks postgres on its next restart (PGDATA must be
# 0700 and owned by the run-user). So just ensure the dir exists and leave ownership
# to postgres; `state: directory` with no owner/mode is idempotent on the existing dir.
- name: Ensure Immich Postgres data dir exists on the ssd immich subvol (issue 006)
  become: true
  ansible.builtin.file:
    path: "{{ immich_db_location }}"
    state: directory

# --- issue 007: Paperless data dirs on the SSD 'paperless' precious subvol -----
# The 'paperless' btrfs subvol itself is provisioned by the storage_ssd role. The
# webserver runs as USERMAP_UID:GID (the jellyfin uid/gid) and writes data/media/
# consume/export as that user, so those must be pre-owned by it before first start.
# pgdata is left to the postgres image to self-chown (same as issue 006), so it is
# NOT chowned here — enforcing owner/mode would reset it to root:root every run and
# break postgres on its next restart (PGDATA must be 0700, owned by the run-user).
- name: Create Paperless data dirs owned by the container uid/gid (issue 007)
  become: true
  ansible.builtin.file:
    path: "{{ paperless_data_root }}/{{ item }}"
    state: directory
    owner: "{{ paperless_usermap_uid }}"
    group: "{{ paperless_usermap_gid }}"
    mode: "0750"
  loop: [data, media, consume, export]

- name: Ensure Paperless Postgres data dir exists on the ssd paperless subvol (issue 007)
  become: true
  ansible.builtin.file:
    path: "{{ paperless_data_root }}/pgdata"
    state: directory

# --- issue 029: Proton Mail Bridge session/keyring dir on the SSD 'appdata' subvol ---
# The bridge container runs as root and writes its session + gpg/pass keyring here (mounted
# at /root). Pre-created root-owned 0700 — it holds the decrypt-capable Proton session, so it
# must not be world/group readable. Skipped cleanly if the var is undefined (non-helium deploy).
- name: Create Proton Mail Bridge data dir owned by root, 0700 (issue 029)
  become: true
  ansible.builtin.file:
    path: "{{ protonmail_bridge_data }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: protonmail_bridge_data is defined

# --- hermes-helium ticket 019: Hermes state dir on the SSD 'appdata' subvol -----
# HERMES_UID/GID=1000 (ms), matching the vault owner on krypton for when ticket 021
# adds that mount. Pre-owned before first start for the same reason as every other
# service above: an unowned bind source gets root-created by Docker and the
# container can't write it. (The image's own boot-time chown of $HERMES_HOME would
# self-heal this too, per ticket 03 — but pre-owning is the house pattern and
# avoids depending on that mechanism at all.)
- name: Create Hermes state dir owned by the container uid/gid (hermes-helium 019)
  become: true
  ansible.builtin.file:
    path: "{{ hermes_data }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  when: hermes_data is defined

# SOUL.md carries the two anti-fabrication rules no engine primitive enforces
# (hermes-helium ticket 02); it is the ONE straight keep from the deleted prior art
# and it is placed here, before first boot, so the container never falls back to its
# own 513-byte default (ticket 05 verified doctor reports that default as
# "persona configured" — existence tells you nothing). Named `src:`, never the
# directory — `files/hermes-agent/` also holds a README and unshipped prior-art
# reference material that must never land on the box (see that README).
- name: Deploy Hermes' SOUL.md identity file (hermes-helium 019)
  become: true
  ansible.builtin.copy:
    src: hermes-agent/SOUL.md
    dest: "{{ hermes_data }}/SOUL.md"
    owner: "1000"
    group: "1000"
    mode: "0644"
  when: hermes_data is defined

# Defensive, not decorative: assert the file ansible just placed actually carries
# the two anti-fabrication sentences ticket 02 recovered it for, rather than trusting
# that the committed copy and the deployed copy can never diverge. Two separate greps
# (not one pattern spanning both) because the file hard-wraps mid-sentence — a grep
# spanning the wrap would never match and this check would fail forever.
- name: Assert SOUL.md carries its anti-fabrication rules (hermes-helium 019)
  become: true
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      grep -q "Never paper over a" "{{ hermes_data }}/SOUL.md" &&
      grep -q "Only state what you can verify from the data in front of you" "{{ hermes_data }}/SOUL.md"
    executable: /bin/bash
  changed_when: false
  when: hermes_data is defined

# --- issue 010: jellyseerr flips from container-root to the jellyfin uid/gid ---------
# jellyseerr's upstream image has no privilege drop; it ran as container-root, so its
# /app/config (sqlite settings + request db + logs) is root-owned. issue 010 sets
# user: "1001:1003" on the container, so it must own that state BEFORE the recreate or
# it cannot read/write its own config and the request loop breaks. Recursive + defensive
# (chowns regardless of current owner); idempotent — a no-op once already 1001:1003, so a
# clean re-run stays changed=0. Ordered before the compose up below.
- name: Chown jellyseerr appdata to the container uid/gid (issue 010 non-root flip)
  become: true
  ansible.builtin.file:
    path: "{{ arr_appdata_dir }}/jellyseerr"
    state: directory
    owner: "{{ jellyfin_puid }}"
    group: "{{ jellyfin_pgid }}"
    recurse: true
  when: arr_appdata_apps is defined

# .env rendered to 0600 — contains Cloudflare DNS token + Traefik dashboard
# basic-auth hash. no_log keeps secret values out of the Ansible output.
- name: Render .env from template (sops secrets + config vars)
  become: true
  ansible.builtin.template:
    src: stack.env.j2
    dest: "{{ compose_stack_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render docker-compose.yml from template
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ compose_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

# Copy verbatim — traefik middleware definitions and TLS options.
# dynamic.yml has no Jinja markers; using copy (not template) makes the
# intent clear and avoids accidental expansion of any future { in the file.
#
# BIND-MOUNT GOTCHA: dynamic.yml is bind-mounted into traefik as a *single file*,
# and a single-file bind mount pins the container to that file's inode. `copy`
# writes a temp file and renames it into place, so the new content lands on a NEW
# inode and the running traefik keeps reading the old one — its file-provider watch
# (on by default) never fires, because from inside the container nothing changed.
# `docker cp` is no help in diagnosing this: it resolves the bind back to the host
# path and shows the new content while traefik is still serving the old config.
# Symptom when this bites: the docker provider hot-reloads label changes but the
# file provider stays stale, so a host that changed hands between the two 404s.
# Hence the restart-on-change handler. (A directory mount + providers.file.directory
# would fix it structurally, but reshaping the reverse proxy's mounts is a bigger,
# riskier change than this deploy needs.)
- name: Copy Traefik dynamic config
  become: true
  ansible.builtin.copy:
    src: traefik/dynamic.yml
    dest: "{{ compose_stack_dir }}/config/traefik/dynamic.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart traefik (compose_stack)

# --- issue 029: build the patched Proton Mail Bridge image (adds libfido2) ---------
# The stock shenxn image's auto-updated bridge needs libfido2, which its dep-stripped
# repack omits; our Dockerfile adds it. Build BEFORE the compose up so `up` sees the
# fresh image and recreates the container when it changes. Skipped when the var is
# undefined (non-helium deploy that has no protonmail-bridge service).
- name: Create the Proton Mail Bridge build-context dir (issue 029)
  become: true
  ansible.builtin.file:
    path: "{{ compose_stack_dir }}/build/protonmail-bridge"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: protonmail_bridge_data is defined

- name: Copy the patched Proton Mail Bridge Dockerfile (issue 029)
  become: true
  ansible.builtin.copy:
    src: protonmail-bridge/Dockerfile
    dest: "{{ compose_stack_dir }}/build/protonmail-bridge/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  when: protonmail_bridge_data is defined

- name: Build the patched Proton Mail Bridge image (issue 029)
  become: true
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f {{ compose_stack_dir }}/docker-compose.yml
      --env-file {{ compose_stack_dir }}/.env
      build protonmail-bridge
  # A cached rebuild is a cheap no-op; the meaningful change (a new image -> container
  # recreate) is reported by the compose-up task below, so don't flag this one as changed.
  changed_when: false
  when: protonmail_bridge_data is defined

# --- hermes-helium ticket 019: build the derived Hermes image ---------------------
# Adds the baked-in healthcheck script on top of the pinned upstream digest — see
# the Dockerfile for why himalaya isn't pinned here yet (deferred to ticket 025).
# Built BEFORE the compose up below, same reasoning as the Proton Bridge build above.
- name: Create the Hermes agent build-context dir (hermes-helium 019)
  become: true
  ansible.builtin.file:
    path: "{{ compose_stack_dir }}/build/hermes-agent"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: hermes_data is defined

- name: Copy the Hermes agent Dockerfile (hermes-helium 019)
  become: true
  ansible.builtin.copy:
    src: hermes-agent/Dockerfile
    dest: "{{ compose_stack_dir }}/build/hermes-agent/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  when: hermes_data is defined

- name: Copy the Hermes healthcheck script (hermes-helium 019)
  become: true
  ansible.builtin.copy:
    src: hermes-agent/hermes-healthcheck
    dest: "{{ compose_stack_dir }}/build/hermes-agent/hermes-healthcheck"
    owner: root
    group: root
    mode: "0755"
  when: hermes_data is defined

- name: Build the derived Hermes agent image (hermes-helium 019)
  become: true
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f {{ compose_stack_dir }}/docker-compose.yml
      --env-file {{ compose_stack_dir }}/.env
      build hermes-agent
  # Same reasoning as the Proton Bridge build above: a cached rebuild is a no-op,
  # and the compose-up task below is what reports a real image change.
  changed_when: false
  when: hermes_data is defined

- name: Bring up the compose stack
  become: true
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f {{ compose_stack_dir }}/docker-compose.yml
      --env-file {{ compose_stack_dir }}/.env
      up -d --remove-orphans
  register: _compose_up
  # docker compose writes progress to stderr (Created/Started/Recreated).
  # We parse stderr because stdout is typically empty on `up -d`.
  changed_when: >-
    'Started' in _compose_up.stderr or
    'Created' in _compose_up.stderr or
    'Recreated' in _compose_up.stderr

# NETNS GOTCHA: qbittorrent/prowlarr/flaresolverr run with
# `network_mode: service:gluetun`. When a compose change recreates the gluetun
# container its network namespace is torn down, and `docker compose up -d` does
# NOT reliably recreate the siblings that were only sharing that namespace — so
# they end up on a dead netns (no networking; Sonarr then reports the Prowlarr
# indexer as "Connection refused (gluetun:9696)"). Detect a gluetun recreate and
# restart the three siblings AFTER gluetun is healthy again. (The gluetun-pf
# watchdog is the runtime backstop; the deploy must not depend on its next tick.)
- name: Wait for gluetun to be healthy after a recreate
  become: true
  ansible.builtin.command:
    cmd: "docker inspect -f '{% raw %}{{ .State.Health.Status }}{% endraw %}' gluetun"
  register: _gluetun_health
  until: _gluetun_health.stdout == 'healthy'
  retries: 24
  delay: 5
  changed_when: false
  when: _compose_up.stderr is search('gluetun\s+Recreated')

- name: Restart gluetun's netns siblings after a gluetun recreate
  become: true
  ansible.builtin.command:
    cmd: docker restart qbittorrent prowlarr flaresolverr
  changed_when: true
  when: _compose_up.stderr is search('gluetun\s+Recreated')

# --- issue 044: pull the paperless-gpt LLM model into Ollama --------------------
# Idempotent by construction: pull only when the exact model:tag is absent from
# `ollama list`, so a re-run stays changed=0. Runs after the stack is up (the ollama
# container must be serving). `until` rides out the few seconds between container start
# and the Ollama API being ready. First pull of qwen2.5:3b is ~2.5 GB (needs external
# DNS from the container, which docker_daemon_options.dns already provides). Skipped
# cleanly on any host that doesn't define the model var.
- name: Pull the paperless-gpt LLM model into Ollama (issue 044)
  become: true
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      if docker exec ollama ollama list | awk 'NR>1 {print $1}' | grep -qx '{{ paperless_gpt_llm_model }}'; then
        echo 'model present';
      else
        docker exec ollama ollama pull '{{ paperless_gpt_llm_model }}';
      fi
    executable: /bin/bash
  register: _ollama_pull
  until: _ollama_pull.rc == 0
  retries: 10
  delay: 6
  changed_when: "'model present' not in _ollama_pull.stdout"
  when: paperless_gpt_llm_model is defined
