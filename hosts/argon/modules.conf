# Modules to install on 'argon' (Proxmox VE hypervisor host, 192.168.1.18).
# Sibling to titan. Hosts the home-assistant VM and (planned) a small
# Debian VM acting as the NetBird routing peer for remote homelab access.
#
# Same minimal admin-shell profile as titan: SSH in, edit configs, do
# hypervisor admin. Proxmox-specific config (repos, firewall, hostname,
# vzdump) is NOT modeled as modules — it lives in a one-shot host setup,
# since PVE's pmxcfs and apt repo layout don't fit the idempotent module
# pattern cleanly.
#
# Run as the `ms` admin user (not root): `cd ~/.dotfiles && ./install.sh`.
# `sshd` requires sudo; ms must have NOPASSWD via /etc/sudoers.d/10-ms-nopasswd
# (mirror titan's setup; create this by hand the first time).

# System base
base
ssh
sshd

# Shell
bash-server
git

# Admin editing
nvim
fzf

# Host-specific tweaks (currently: e1000e TX-hang mitigation on eno1)
argon-tweaks
