---
# Plain (non-secret) vars for radon — the first public edge host (issue 024).
# The Cloudflare Origin cert + private key live sops-encrypted alongside this
# file in secrets.sops.yml (admin-key-only; consumed by roles/edge_stack).

# Where the edge_stack role renders the compose project + Traefik config, and
# where `docker compose` runs from.
edge_stack_dir: /opt/radon

# settleup — the public app (issue 023 image on GHCR). PINNED, never :latest.
# No semver v* is published yet, so this is the current build's sha tag
# (`skopeo list-tags docker://ghcr.io/stromdahl/settleup` / GHCR tags API).
# Bump to a released vX.Y.Z tag once one exists.
settleup_image: ghcr.io/stromdahl/settleup:sha-153c7e3
settleup_host: settleup.stromdahl.io
settleup_base_url: https://settleup.stromdahl.io
